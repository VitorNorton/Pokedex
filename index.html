<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/pokedex.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon" />
</head>
<body>
    <section class="sectionIndex">
        <header>
            <a href="https://github.com/vitornorton"><object class="arrow-left" data="assets/img/arrow-left-solid.svg"></object></a>
            <div id="menuBtn" class="menu-btn">
                <object class="menu-bar" data="assets/img/bars-solid.svg"></object>
            </div>
            <img class="pokeball-img" src="assets/img/poke_ball_icon.png" alt="">
        </header>

        <div class="menu-drawer" id="menuDrawer">
            <button class="menu-item" id="sortByIdBtn" onclick="sortBy('id')">
                <i class="fa-solid fa-arrow-up-1-9" id="sortByIdIcon"></i> Ordenar por número
            </button>
            <button class="menu-item" id="sortByNameBtn" onclick="sortBy('name')">
                <i class="fa-solid fa-arrow-down-a-z" id="sortByNameIcon"></i> Ordenar por nome
            </button>
        </div>

        <h1>Pokedex</h1>
        <ol id="listaPokemons" class="pokemons"></ol>
    </section>

    <button class="fab-filter" id="fabFilter">
        <i class="fa-solid fa-sliders"></i>
    </button>

    <div class="filter-overlay" id="filterOverlay"></div>
    <div class="filter-panel" id="filterPanel">
        <div class="filter-header">
            <span class="filter-title">Buscar / Filtrar</span>
            <button class="clear-filter" id="clearFilter">Limpar</button>
        </div>
        <div class="filter-search">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nome...">
        </div>
        <span class="filter-section-label">Filtrar por tipo</span>
        <div class="filter-types" id="filterTypes"></div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="https://kit.fontawesome.com/904e76c853.js" crossorigin="anonymous"></script>
</body>
</html>
