<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/pokemon.css" />
    <!-- Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="assets/img/favicon.ico"
      type="image/x-icon"
    />
  </head>
  <body>
    <div id="pokemonSpecified"></div>

    <div class="move-modal-overlay" id="moveModalOverlay" onclick="closeMoveModal()">
      <div class="move-modal" onclick="event.stopPropagation()">
        <div class="move-modal-header">
          <div class="move-modal-title">
            <span class="move-modal-name capitalize" id="moveModalName"></span>
            <span id="moveModalType"></span>
          </div>
          <button class="move-modal-close" onclick="closeMoveModal()">✕</button>
        </div>
        <div class="move-modal-stats" id="moveModalStats">
          <div class="move-stat-item">
            <span class="move-stat-label">Poder</span>
            <span class="move-stat-value" id="moveModalPower"></span>
          </div>
          <div class="move-stat-item">
            <span class="move-stat-label">Precisão</span>
            <span class="move-stat-value" id="moveModalAccuracy"></span>
          </div>
          <div class="move-stat-item">
            <span class="move-stat-label">PP</span>
            <span class="move-stat-value" id="moveModalPP"></span>
          </div>
          <div class="move-stat-item">
            <span class="move-stat-label">Categoria</span>
            <span class="move-stat-value capitalize" id="moveModalClass"></span>
          </div>
        </div>
        <div class="move-modal-loading" id="moveModalLoading">Carregando...</div>
        <p class="move-modal-effect" id="moveModalEffect"></p>
      </div>
    </div>

    <script src="assets/js/pokemon.js"></script>
    <script
      src="https://kit.fontawesome.com/904e76c853.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
